<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Docket — Workspace</title>
<style>
  :root {
    --bg: #FFFFFF; --sidebar: #F7F7F5; --ink: #2F3437; --muted: #7D7A75; --faint: #B4B1AB;
    --line: #E8E7E4; --hover: rgba(47,52,55,.07); --hover-strong: rgba(47,52,55,.12);
    --popover: #FFFFFF; --card: #FFFFFF; --callout: #F4F3F0; --accent: #2F6FDE; --on-accent: #FFFFFF;
    --danger: #D44C47; --focus: #2F6FDE; --shadow: rgba(15,15,15,.14);
    --gray-bg: #ECEBE8; --gray-fg: #5A5853; --blue-bg: #DDEBFA; --blue-fg: #1F5FA8;
    --green-bg: #DCEFE3; --green-fg: #2C6E49; --yellow-bg: #FAEFD0; --yellow-fg: #8A6213;
    --red-bg: #FBE2DF; --red-fg: #A9362F; --purple-bg: #ECE3F7; --purple-fg: #6A3FA0;
    --orange-bg: #FBE6D3; --orange-fg: #9A4E12; --pink-bg: #F8E0EC; --pink-fg: #9C3368;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --sidebar: #202020; --ink: #E3E2DF; --muted: #9B9A97; --faint: #5F5E5B;
      --line: #2F2F2F; --hover: rgba(255,255,255,.055); --hover-strong: rgba(255,255,255,.1);
      --popover: #252525; --card: #232323; --callout: #262626; --accent: #4C8DF6; --on-accent: #FFFFFF;
      --danger: #E5675F; --focus: #6FA3FF; --shadow: rgba(0,0,0,.5);
      --gray-bg: #343434; --gray-fg: #C4C3BF; --blue-bg: #1E3550; --blue-fg: #8DBBF2;
      --green-bg: #1F3A2B; --green-fg: #7FCB9C; --yellow-bg: #43381A; --yellow-fg: #E6C46A;
      --red-bg: #4A2422; --red-fg: #F09A93; --purple-bg: #35284A; --purple-fg: #C3A6EB;
      --orange-bg: #46301D; --orange-fg: #EDA66A; --pink-bg: #44263A; --pink-fg: #EB9CC4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --sidebar: #202020; --ink: #E3E2DF; --muted: #9B9A97; --faint: #5F5E5B;
    --line: #2F2F2F; --hover: rgba(255,255,255,.055); --hover-strong: rgba(255,255,255,.1);
    --popover: #252525; --card: #232323; --callout: #262626; --accent: #4C8DF6; --on-accent: #FFFFFF;
    --danger: #E5675F; --focus: #6FA3FF; --shadow: rgba(0,0,0,.5);
    --gray-bg: #343434; --gray-fg: #C4C3BF; --blue-bg: #1E3550; --blue-fg: #8DBBF2;
    --green-bg: #1F3A2B; --green-fg: #7FCB9C; --yellow-bg: #43381A; --yellow-fg: #E6C46A;
    --red-bg: #4A2422; --red-fg: #F09A93; --purple-bg: #35284A; --purple-fg: #C3A6EB;
    --orange-bg: #46301D; --orange-fg: #EDA66A; --pink-bg: #44263A; --pink-fg: #EB9CC4;
    color-scheme: dark;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 4px; }
  .hidden { display: none !important; }
  svg { display: block; }

  /* ---------- Shared bits ---------- */
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
  .brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
  .icon-btn { width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn svg { width: 18px; height: 18px; }
  .sun { display: none !important; }
  :root[data-theme="dark"] .sun { display: block !important; }
  :root[data-theme="dark"] .moon { display: none !important; }
  .btn-primary { height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; }
  .btn-primary:hover { filter: brightness(1.08); }

  /* ---------- Auth ---------- */
  .auth-screen { min-height: 100%; display: flex; flex-direction: column; }
  .auth-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; }
  .auth-center { flex: 1; width: 100%; max-width: 400px; margin: 0 auto; padding: 32px 20px 64px; }
  .auth-center h1 { font-size: clamp(1.8rem, 5vw, 2.3rem); line-height: 1.12; letter-spacing: -0.03em; margin: 0 0 10px; font-weight: 700; }
  .auth-sub { margin: 0 0 28px; color: var(--muted); font-size: 1.05rem; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--sidebar); border: 1px solid var(--line); border-radius: 8px; padding: 3px; margin-bottom: 20px; }
  .tab { border: 0; background: transparent; padding: 7px; border-radius: 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }
  .field { display: grid; gap: 5px; margin-bottom: 14px; }
  .field label { font-weight: 600; font-size: 13px; color: var(--muted); }
  .field input { width: 100%; height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--sidebar); }
  .field input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  .hint { color: var(--muted); font-size: 12px; }
  .error { color: var(--danger); font-size: 14px; margin: -2px 0 12px; min-height: 1.3em; }
  .submit { width: 100%; height: 42px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .submit:hover { filter: brightness(1.08); }
  .fine { margin: 18px 0 0; color: var(--muted); font-size: 13px; }
  .link-btn { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; }

  /* ---------- App layout ---------- */
  .app { display: flex; height: 100%; overflow: hidden; }
  .sidebar {
    width: 252px; flex: none; background: var(--sidebar); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; height: 100%; overflow-y: auto; padding: 8px 6px; transition: margin-left .2s ease;
    font-size: 14px;
  }
  .app.collapsed .sidebar { margin-left: -252px; }
  .ws-switch { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; text-align: left; font-weight: 600; }
  .ws-switch:hover, .side-item:hover { background: var(--hover); }
  .ws-avatar { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .ws-name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ws-switch svg { width: 14px; height: 14px; color: var(--muted); }
  .side-item { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 5px 8px; border-radius: 6px; color: var(--muted); font-weight: 500; text-align: left; }
  .side-item svg { width: 16px; height: 16px; flex: none; }
  .side-item kbd { margin-left: auto; font: inherit; font-size: 11px; color: var(--faint); }
  .side-group { margin-top: 18px; padding: 0 8px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 8px; border-radius: 6px; color: var(--muted); font-weight: 500; cursor: pointer; min-height: 30px; }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--hover-strong); color: var(--ink); }
  .nav-icon { width: 20px; text-align: center; flex: none; font-size: 15px; }
  .nav-title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .nav-more { width: 24px; height: 24px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); display: grid; place-items: center; opacity: 0; }
  .nav-item:hover .nav-more, .nav-item.active .nav-more, .nav-more:focus-visible { opacity: 1; }
  .nav-more:hover { background: var(--hover-strong); }
  .nav-more svg { width: 16px; height: 16px; }
  .side-foot { margin-top: auto; padding: 16px 8px 4px; font-size: 12px; color: var(--faint); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  .topbar { height: 46px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .crumb { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 3px 6px; font-size: 14px; }
  .crumb span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .edited { font-size: 13px; color: var(--faint); white-space: nowrap; margin-right: 4px; }
  .scroller { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .scrim { display: none; }

  /* ---------- Page ---------- */
  .cover { position: relative; height: clamp(130px, 28vh, 230px); }
  .cover-actions { position: absolute; right: 16px; bottom: 12px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
  .cover:hover .cover-actions, .cover-actions:focus-within { opacity: 1; }
  .cover-actions button { border: 0; border-radius: 5px; background: rgba(255,255,255,.88); color: #2F3437; font-size: 12px; font-weight: 600; padding: 4px 10px; }
  .page { max-width: 780px; margin: 0 auto; padding: 0 56px 30vh; }
  .page.wide { max-width: 1120px; }
  .page-head { padding-top: 64px; margin-bottom: 8px; }
  .has-cover .page-head { padding-top: 22px; }
  .page-icon { font-size: 64px; line-height: 1.1; border: 0; background: transparent; padding: 4px; border-radius: 8px; margin-left: -4px; }
  .page-icon:hover { background: var(--hover); }
  .has-cover .page-icon { margin-top: -66px; position: relative; }
  .page-controls { display: flex; gap: 4px; margin: 8px 0 4px -6px; opacity: 0; transition: opacity .15s; min-height: 28px; }
  .page-head:hover .page-controls, .page-controls:focus-within { opacity: 1; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--faint); font-size: 14px; padding: 4px 6px; border-radius: 5px; }
  .ghost:hover { background: var(--hover); color: var(--muted); }
  .ghost svg { width: 15px; height: 15px; }
  .page-title { font-size: 40px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; outline: none; white-space: pre-wrap; word-break: break-word; padding: 3px 0; }
  .page-title:empty::before { content: attr(data-placeholder); color: var(--faint); }

  /* ---------- Blocks ---------- */
  .blocks { padding-top: 6px; }
  .block { position: relative; display: flex; align-items: flex-start; gap: 4px; margin: 1px 0; border-radius: 4px; }
  .block.drop-above { box-shadow: inset 0 3px 0 -1px var(--accent); }
  .block.drop-below { box-shadow: inset 0 -3px 0 -1px var(--accent); }
  .block.dragging { opacity: .35; }
  .gutter { position: absolute; left: -50px; top: 2px; display: flex; gap: 1px; opacity: 0; transition: opacity .1s; }
  .block:hover .gutter, .gutter:focus-within { opacity: 1; }
  .g-btn { width: 24px; height: 24px; border: 0; border-radius: 4px; background: transparent; color: var(--faint); display: grid; place-items: center; }
  .g-btn:hover { background: var(--hover); color: var(--muted); }
  .g-btn svg { width: 16px; height: 16px; }
  .handle { cursor: grab; }
  .editable { flex: 1; min-width: 0; outline: none; white-space: pre-wrap; word-break: break-word; padding: 3px 2px; min-height: 1.5em; }
  .editable:empty::before { content: attr(data-placeholder); color: var(--faint); pointer-events: none; }
  .block[data-type="p"] .editable:not(:focus):empty::before { content: ""; }
  .block[data-type="h1"] { margin-top: 1.4em; }
  .block[data-type="h1"] .editable { font-size: 1.875em; font-weight: 700; line-height: 1.3; letter-spacing: -0.015em; }
  .block[data-type="h2"] { margin-top: 1.1em; }
  .block[data-type="h2"] .editable { font-size: 1.5em; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
  .block[data-type="h3"] { margin-top: .8em; }
  .block[data-type="h3"] .editable { font-size: 1.25em; font-weight: 650; line-height: 1.3; }
  .block[data-type="h1"] .gutter { top: 12px; }
  .block[data-type="h2"] .gutter { top: 8px; }
  .block[data-type="h3"] .gutter { top: 5px; }
  .marker { width: 24px; flex: none; text-align: center; padding-top: 3px; user-select: none; }
  .block[data-type="numbered"] .marker { text-align: right; padding-right: 4px; width: 28px; }
  .todo-box { width: 18px; height: 18px; margin: 5px 4px 0 3px; border: 1.5px solid var(--muted); border-radius: 3px; background: transparent; padding: 0; display: grid; place-items: center; flex: none; color: var(--on-accent); }
  .todo-box svg { width: 13px; height: 13px; opacity: 0; }
  .block.checked .todo-box { background: var(--accent); border-color: var(--accent); }
  .block.checked .todo-box svg { opacity: 1; }
  .block.checked .editable { color: var(--faint); text-decoration: line-through; }
  .block[data-type="quote"] .editable { border-left: 3px solid var(--ink); padding-left: 14px; margin: 4px 0; font-size: 1.05em; }
  .callout { flex: 1; display: flex; gap: 10px; background: var(--callout); border-radius: 6px; padding: 14px 16px 14px 12px; margin: 4px 0; }
  .callout-icon { font-size: 20px; line-height: 1.3; flex: none; }
  .divider { flex: 1; padding: 10px 2px; }
  .divider hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
  .blocks-tail { min-height: 120px; cursor: text; }

  /* ---------- Menus ---------- */
  .menu {
    position: fixed; z-index: 60; background: var(--popover); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 32px var(--shadow), 0 1px 3px var(--shadow); padding: 5px; min-width: 220px; max-width: 320px;
    max-height: min(380px, 70vh); overflow-y: auto; font-size: 14px;
  }
  .menu-heading { padding: 6px 8px 4px; font-size: 12px; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-sep { height: 1px; background: var(--line); margin: 4px 2px; }
  .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 6px 8px; border-radius: 5px; text-align: left; }
  .menu-item:hover, .menu-item.active { background: var(--hover-strong); }
  .menu-item.danger { color: var(--danger); }
  .mi-ic { width: 18px; height: 18px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .mi-ic svg { width: 16px; height: 16px; }
  .menu-item.danger .mi-ic { color: var(--danger); }
  .slash-ic { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 15px; flex: none; }
  .slash-label { display: block; font-weight: 500; }
  .slash-desc { display: block; font-size: 12px; color: var(--muted); }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 34px); gap: 2px; padding: 4px; }
  .emoji-grid button { width: 34px; height: 34px; border: 0; background: transparent; border-radius: 5px; font-size: 20px; }
  .emoji-grid button:hover { background: var(--hover-strong); }

  /* ---------- Database ---------- */
  .db-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); margin: 10px 0 14px; flex-wrap: wrap; }
  .views { display: flex; gap: 2px; }
  .view-tab { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 8px 8px 9px; font-size: 14px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .view-tab svg { width: 16px; height: 16px; }
  .view-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .view-tab:hover { color: var(--ink); }
  .db-right { display: flex; align-items: center; gap: 12px; padding-bottom: 6px; }
  .db-count { font-size: 13px; color: var(--muted); }

  .pill, .pill-select { display: inline-block; border-radius: 4px; padding: 1px 7px; font-size: 13px; line-height: 1.6; white-space: nowrap; }
  .pill-select { appearance: none; -webkit-appearance: none; border: 0; cursor: pointer; padding: 1px 8px; max-width: 100%; }
  .c-gray { background: var(--gray-bg); color: var(--gray-fg); }
  .c-blue { background: var(--blue-bg); color: var(--blue-fg); }
  .c-green { background: var(--green-bg); color: var(--green-fg); }
  .c-yellow { background: var(--yellow-bg); color: var(--yellow-fg); }
  .c-red { background: var(--red-bg); color: var(--red-fg); }
  .c-purple { background: var(--purple-bg); color: var(--purple-fg); }
  .c-orange { background: var(--orange-bg); color: var(--orange-fg); }
  .c-pink { background: var(--pink-bg); color: var(--pink-fg); }
  .c-none { background: transparent; color: var(--faint); }
  .pill-select option { background: var(--popover); color: var(--ink); }

  .table-wrap { overflow-x: auto; }
  .db-table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 14px; }
  .db-table th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap; }
  .db-table td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px 6px; height: 38px; }
  .db-table th:last-child, .db-table td:last-child { border-right: 0; }
  .col-name { width: 40%; }
  .col-del { width: 40px; text-align: center; }
  .cell-input { width: 100%; border: 0; background: transparent; padding: 4px 4px; border-radius: 4px; min-width: 0; }
  .cell-input:focus { outline: none; background: var(--hover); }
  .name-input { font-weight: 500; }
  tr.is-done .name-input { color: var(--faint); text-decoration: line-through; }
  .due-input.overdue { color: var(--danger); font-weight: 600; }
  .row-del { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 4px; color: var(--faint); display: grid; place-items: center; opacity: 0; }
  tr:hover .row-del, .row-del:focus-visible { opacity: 1; }
  .row-del:hover { background: var(--hover-strong); color: var(--danger); }
  .row-del svg { width: 15px; height: 15px; }
  .add-row td { border-right: 0; }
  .add-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--faint); font-size: 14px; padding: 4px 6px; border-radius: 5px; width: 100%; text-align: left; }
  .add-btn:hover { background: var(--hover); color: var(--muted); }
  .add-btn svg { width: 15px; height: 15px; }

  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 20px; align-items: flex-start; }
  .col { width: 272px; flex: none; border-radius: 8px; padding: 4px; transition: background .12s; }
  .col.drag-over { background: var(--hover); }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 10px; }
  .col-count { color: var(--faint); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px 10px; margin-bottom: 8px; box-shadow: 0 1px 2px var(--shadow); cursor: grab; position: relative; }
  .card.dragging { opacity: .4; }
  .card-title { display: block; width: 100%; border: 0; background: transparent; resize: none; overflow: hidden; font-weight: 500; font-size: 14px; line-height: 1.4; padding: 2px 26px 2px 2px; border-radius: 4px; min-height: 24px; }
  .card-title:focus { outline: none; background: var(--hover); }
  .card.is-done .card-title { color: var(--faint); text-decoration: line-through; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .card-meta .pill { font-size: 12px; }
  .card-meta .overdue { color: var(--danger); font-weight: 600; }
  .card-more { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); display: grid; place-items: center; opacity: 0; }
  .card:hover .card-more, .card-more:focus-visible { opacity: 1; }
  .card-more:hover { background: var(--hover-strong); }
  .card-more svg { width: 16px; height: 16px; }

  /* ---------- Search modal ---------- */
  .modal-back { position: fixed; inset: 0; background: rgba(15,15,15,.45); z-index: 70; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
  .modal { width: min(560px, 100%); background: var(--popover); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; border: 1px solid var(--line); }
  .search-input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 16px 18px; font-size: 17px; outline: none; }

<script>
(function () {
  "use strict";

  // ================= Helpers =================
  const $ = (id) => document.getElementById(id);
  const mem = {};
  const store = {
    get(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return k in mem ? mem[k] : fb; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = v; } },
    remove(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
  };
  const KEYS = { users: "docket.users", session: "docket.session", theme: "docket.theme", ws: (e) => "docket.ws." + e, oldTasks: (e) => "docket.tasks." + e };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const B = (type, text, checked) => ({ id: uid(), type, text: text || "", checked: !!checked });

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "value") el.value = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat(Infinity)) {
      if (c == null || c === false) continue;
      el.append(c instanceof Node ? c : String(c));
    }
    return el;
  }

  const fmt = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const todayStr = () => fmt(new Date());
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return fmt(d); };
  function formatDue(due) {
    if (due === todayStr()) return "Today";
    if (due === addDays(1)) return "Tomorrow";
    if (due === addDays(-1)) return "Yesterday";
    const [y, m, d] = due.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function ago(ts) {
    const s = (Date.now() - (ts || Date.now())) / 1000;
    if (s < 60) return "Edited just now";
    if (s < 3600) return "Edited " + Math.floor(s / 60) + " min ago";
    if (s < 86400) return "Edited " + Math.floor(s / 3600) + " hr ago";
    return "Edited " + new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  const ICON = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M18 7l-.9 12.5H6.9L6 7"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 10h17M3.5 15h17M10 10v9.5"/></svg>',
    board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="4.5" width="5" height="15" rx="1.2"/><rect x="9.5" y="4.5" width="5" height="10" rx="1.2"/><rect x="15.5" y="4.5" width="5" height="12.5" rx="1.2"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>',
    smile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-9 8.5"/></svg>'
  };

  const COVERS = [
    "linear-gradient(120deg, #F6D365, #FDA085)",
    "linear-gradient(120deg, #A1C4FD, #C2E9FB)",
    "linear-gradient(120deg, #84FAB0, #8FD3F4)",
    "linear-gradient(120deg, #D4C1EC, #F3B9C9)",
    "linear-gradient(120deg, #2C3E50, #4CA1AF)",
    "linear-gradient(120deg, #FBC2EB, #A6C1EE)"
  ];
  const EMOJI = ["📄","📝","📓","📚","✅","🎯","🚀","💡","📌","🧠","💼","🏠","🎓","📈","💻","🎨","🧪","🗓️","⭐","🔥","🌱","☕","🎵","👋"];
  const BLOCK_TYPES = [
    { type: "p", label: "Text", desc: "Plain writing", icon: "Aa" },
    { type: "h1", label: "Heading 1", desc: "Big section heading", icon: "H1" },
    { type: "h2", label: "Heading 2", desc: "Medium section heading", icon: "H2" },
    { type: "h3", label: "Heading 3", desc: "Small section heading", icon: "H3" },
    { type: "todo", label: "To-do list", desc: "Track tasks with a checkbox", icon: "☑" },
    { type: "bullet", label: "Bulleted list", desc: "A simple bulleted list", icon: "•" },
    { type: "numbered", label: "Numbered list", desc: "A list with numbers", icon: "1." },
    { type: "quote", label: "Quote", desc: "Set off a quote", icon: "❝" },
    { type: "callout", label: "Callout", desc: "Make a note stand out", icon: "💡" },
    { type: "divider", label: "Divider", desc: "Separate sections", icon: "—" }
  ];
  const PLACEHOLDER = { p: "Type ‘/’ for commands", h1: "Heading 1", h2: "Heading 2", h3: "Heading 3", todo: "To-do", bullet: "List", numbered: "List", quote: "Empty quote", callout: "Type something…" };
  const MD = [["### ", "h3"], ["## ", "h2"], ["# ", "h1"], ["- ", "bullet"], ["* ", "bullet"], ["1. ", "numbered"], ["[] ", "todo"], ["[ ] ", "todo"], ["> ", "quote"]];
  const STATUSES = ["To do", "In progress", "Done"];
  const STATUS_COLOR = { "To do": "gray", "In progress": "blue", "Done": "green" };
  const PRIORITIES = ["Low", "Medium", "High"];
  const PRIORITY_COLOR = { Low: "gray", Medium: "yellow", High: "red" };
  const TAGS = ["", "School", "Work", "Personal"];
  const TAG_COLOR = { School: "purple", Work: "orange", Personal: "pink" };

  // ================= Theme =================
  const root = document.documentElement;
  const sysDark = () => window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  const currentTheme = () => root.dataset.theme || (sysDark() ? "dark" : "light");
  function applyTheme(t) {
    root.dataset.theme = t;
    document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode"));
  }
  function toggleTheme() {
    const next = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(next); store.set(KEYS.theme, next);
  }
  applyTheme(store.get(KEYS.theme, null) || currentTheme());
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", toggleTheme));

  // ================= Auth =================
  async function hashPassword(pw, salt) {
    const text = salt + ":" + pw;
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    let x = 5381; for (let i = 0; i < text.length; i++) x = ((x << 5) + x + text.charCodeAt(i)) >>> 0;
    return "f" + x.toString(16);
  }
  function makeSalt() {
    const a = new Uint8Array(12);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else a.forEach((_, i) => a[i] = Math.random() * 256);
    return Array.from(a).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

  function showTab(which) {
    const login = which === "login";
    $("tabLogin").setAttribute("aria-selected", login);
    $("tabSignup").setAttribute("aria-selected", !login);
    $("loginForm").classList.toggle("hidden", !login);
    $("signupForm").classList.toggle("hidden", login);
    $("loginError").textContent = ""; $("signupError").textContent = "";
    (login ? $("loginEmail") : $("suName")).focus();
  }
  $("tabLogin").addEventListener("click", () => showTab("login"));
  $("tabSignup").addEventListener("click", () => showTab("signup"));
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.go)));

  $("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("signupError");
    const name = $("suName").value.trim();
    const email = $("suEmail").value.trim().toLowerCase();
    const pass = $("suPass").value, pass2 = $("suPass2").value;
    if (!name) return err.textContent = "Enter your name.";
    if (!validEmail(email)) return err.textContent = "Enter a valid email, like you@example.com.";
    if (pass.length < 6) return err.textContent = "Password needs at least 6 characters.";
    if (pass !== pass2) return err.textContent = "Passwords don’t match. Retype them.";
    const users = store.get(KEYS.users, {});
    if (users[email]) return err.textContent = "That email already has an account. Log in instead.";
    const salt = makeSalt();
    users[email] = { name, email, salt, hash: await hashPassword(pass, salt), created: Date.now() };
    store.set(KEYS.users, users);
    store.set(KEYS.session, email);
    e.target.reset();
    startApp(email);
    toast("Account created");
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("loginError");
    const email = $("loginEmail").value.trim().toLowerCase();
    const pass = $("loginPass").value;
    if (!validEmail(email) || !pass) return err.textContent = "Enter your email and password.";
    const u = store.get(KEYS.users, {})[email];
    if (!u || (await hashPassword(pass, u.salt)) !== u.hash) return err.textContent = "Email or password is incorrect.";
    store.set(KEYS.session, email);
    e.target.reset();
    startApp(email);
    toast("Logged in");
  });

  function logout() {
    saveNow();
    closePopover(); closeSlash();
    store.remove(KEYS.session);
    user = null; ws = null;
    $("appView").classList.add("hidden");
    $("authView").classList.remove("hidden");
    showTab("login");
    toast("Logged out");
  }

  // ================= Workspace state =================
  let user = null, ws = null, saveTimer = null, dragBlockId = null, dragRowId = null;

  const page = () => ws.pages.find(p => p.id === ws.currentId) || ws.pages[0];
  function saveNow() { clearTimeout(saveTimer); if (user && ws) store.set(KEYS.ws(user.email), ws); }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
  function touch(p) { p.updated = Date.now(); updateEdited(); save(); }
  function updateEdited() { if (ws) $("edited").textContent = ago(page().updated); }

  function seed(u) {
    const old = store.get(KEYS.oldTasks(u.email), []);

    const rows = old.length

  function moveBlock(p, fromId, toId, below) {

  function onInput(p, b, el) {
    const text = el.textContent.replace(/\u00a0/g, " ");

    b.text = text;

    if (b.type === "p" && (text === "---" || text === "***")) {

  function onKey(e, p, b, el) {

      if (e.key === "ArrowUp") { e.preventDefault(); setSlashActive((slash.index - 1 + len) % len); return; }

  }
  function outside(e) { if (pop && !pop.contains(e.target)) closePopover(); }
  function escClose(e) { if (e.key === "Escape") closePopover(); }
  function closePopover() {
    if (pop) { pop.remove(); pop = null; }
    document.removeEventListener("mousedown", outside, true);
    document.removeEventListener("keydown", escClose, true);
  }
  function openMenu(anchor, items) {
    openPopover(anchor, items.map(it => {
      if (it.sep) return h("div", { class: "menu-sep" });
      if (it.heading) return h("div", { class: "menu-heading" }, it.heading);
      return h("button", { class: "menu-item" + (it.danger ? " danger" : ""), type: "button", role: "menuitem", onclick: () => { closePopover(); it.action(); } },
        it.icon ? h("span", { class: "mi-ic", html: it.icon }) : it.iconText ? h("span", { class: "mi-ic" }, it.iconText) : null,
        it.label);
    }));
  }

  // ================= Task database =================
  const isOverdue = (r) => r.due && r.status !== "Done" && r.due < todayStr();

  function renderDb(p, focusRowId) {
    const body = $("pageBody");
    body.innerHTML = "";
    const done = p.rows.filter(r => r.status === "Done").length;
    body.append(h("div", { class: "db-bar" },
      h("div", { class: "views", role: "tablist", "aria-label": "Views" },
        [["board", "Board", ICON.board], ["table", "Table", ICON.table]].map(([v, label, icon]) =>
          h("button", { class: "view-tab" + (p.view === v ? " active" : ""), type: "button", role: "tab", "aria-selected": String(p.view === v),
            onclick: () => { p.view = v; touch(p); renderDb(p); }, html: icon + "<span>" + label + "</span>" }))),
      h("div", { class: "db-right" },
        h("span", { class: "db-count" }, done + " of " + p.rows.length + " done"),
        h("button", { class: "btn-primary", type: "button", onclick: () => addRow(p, "To do") }, "New task"))
    ));
    body.append(p.view === "table" ? tableEl(p) : boardEl(p));
    document.querySelectorAll(".card-title").forEach(autoGrow);
    if (focusRowId) {
      const el = document.querySelector('[data-id="' + focusRowId + '"] .name-input, [data-id="' + focusRowId + '"] .card-title');
      if (el) el.focus();
    }
  }

  function addRow(p, status) {
    const r = { id: uid(), title: "", status, priority: "Medium", due: "", tag: "" };
    p.rows.push(r); touch(p); renderDb(p, r.id);
  }
  function deleteRow(p, r) { p.rows = p.rows.filter(x => x !== r); touch(p); renderDb(p); toast("Task deleted"); }

  function pillSelect(opts, value, colors, onChange, label) {
    const s = h("select", { class: "pill-select", "aria-label": label }, opts.map(o => h("option", { value: o }, o || "Empty")));
    s.value = value || "";
    const paint = () => { s.className = "pill-select c-" + (colors[s.value] || "none"); };
    paint();
    s.addEventListener("change", () => { paint(); onChange(s.value); });
    return s;
  }

  function tableEl(p) {
    const tbody = h("tbody");
    p.rows.forEach(r => {
      const due = h("input", { class: "cell-input due-input" + (isOverdue(r) ? " overdue" : ""), type: "date", value: r.due, "aria-label": "Due date" });
      due.addEventListener("change", () => { r.due = due.value; due.classList.toggle("overdue", !!isOverdue(r)); touch(p); });
      tbody.append(h("tr", { "data-id": r.id, class: r.status === "Done" ? "is-done" : null },
        h("td", { class: "col-name" }, h("input", { class: "cell-input name-input", value: r.title, placeholder: "Untitled", "aria-label": "Task name",
          oninput: (e) => { r.title = e.target.value; touch(p); }, onkeydown: (e) => { if (e.key === "Enter") e.target.blur(); } })),
        h("td", null, pillSelect(STATUSES, r.status, STATUS_COLOR, (v) => { r.status = v; touch(p); renderDb(p); }, "Status")),
        h("td", null, pillSelect(PRIORITIES, r.priority, PRIORITY_COLOR, (v) => { r.priority = v; touch(p); }, "Priority")),
        h("td", null, due),
        h("td", null, pillSelect(TAGS, r.tag, TAG_COLOR, (v) => { r.tag = v; touch(p); }, "Tag")),
        h("td", { class: "col-del" }, h("button", { class: "row-del", type: "button", "aria-label": "Delete " + (r.title || "task"), html: ICON.trash, onclick: () => deleteRow(p, r) }))
      ));
    });
    tbody.append(h("tr", { class: "add-row" }, h("td", { colspan: "6" },
      h("button", { class: "add-btn", type: "button", onclick: () => addRow(p, "To do"), html: ICON.plus + "<span>New</span>" }))));
    return h("div", { class: "table-wrap" }, h("table", { class: "db-table" },
      h("thead", null, h("tr", null, ["Name", "Status", "Priority", "Due", "Tag", ""].map((c, i) => h("th", { class: i === 0 ? "col-name" : i === 5 ? "col-del" : null, scope: "col" }, c)))),
      tbody));
  }

  function autoGrow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

  function boardEl(p) {
    const board = h("div", { class: "board" });
    STATUSES.forEach(s => {
      const rows = p.rows.filter(r => r.status === s);
      const cards = h("div", { class: "cards" }, rows.map(r => cardEl(p, r)));
      const col = h("div", { class: "col", "data-status": s },
        h("div", { class: "col-head" }, h("span", { class: "pill c-" + STATUS_COLOR[s] }, s), h("span", { class: "col-count" }, String(rows.length))),
        cards,
        h("button", { class: "add-btn", type: "button", onclick: () => addRow(p, s), html: ICON.plus + "<span>New</span>" }));
      col.addEventListener("dragover", (e) => { if (!dragRowId) return; e.preventDefault(); col.classList.add("drag-over"); });
      col.addEventListener("dragleave", (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("drag-over"); });
      col.addEventListener("drop", (e) => {
        if (!dragRowId) return;
        e.preventDefault();
        const r = p.rows.find(x => x.id === dragRowId);
        dragRowId = null;
        if (!r) return;
        const before = Array.from(cards.querySelectorAll(".card:not(.dragging)")).find(c => {
          const rc = c.getBoundingClientRect(); return e.clientY < rc.top + rc.height / 2;
        });
        p.rows.splice(p.rows.indexOf(r), 1);
        const moved = r.status !== s;
        r.status = s;
        if (before) p.rows.splice(p.rows.findIndex(x => x.id === before.dataset.id), 0, r);
        else { const last = p.rows.map(x => x.status).lastIndexOf(s); p.rows.splice(last + 1, 0, r); }
        touch(p); renderDb(p);
        if (moved) toast("Moved to " + s);
      });
      board.append(col);
    });
    return board;
  }

  function cardEl(p, r) {
    const card = h("div", { class: "card" + (r.status === "Done" ? " is-done" : ""), draggable: "true", "data-id": r.id });
    card.addEventListener("dragstart", (e) => {
      if (e.target !== card) return;
      dragRowId = r.id; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", r.id);
      setTimeout(() => card.classList.add("dragging"), 0);
    });
    card.addEventListener("dragend", () => {
      dragRowId = null; card.classList.remove("dragging");
      document.querySelectorAll(".col.drag-over").forEach(c => c.classList.remove("drag-over"));
    });
    const title = h("textarea", { class: "card-title", rows: "1", placeholder: "Untitled", "aria-label": "Task name" });
    title.value = r.title;
    title.addEventListener("input", () => { r.title = title.value.replace(/\n/g, " "); autoGrow(title); touch(p); });
    title.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); title.blur(); } });
    title.addEventListener("mousedown", () => card.setAttribute("draggable", "false"));
    title.addEventListener("blur", () => card.setAttribute("draggable", "true"));

    const meta = h("div", { class: "card-meta" },
      h("span", { class: "pill c-" + PRIORITY_COLOR[r.priority] }, r.priority),
      r.tag && h("span", { class: "pill c-" + (TAG_COLOR[r.tag] || "gray") }, r.tag),
      r.due && h("span", { class: isOverdue(r) ? "overdue" : null }, (isOverdue(r) ? "Overdue · " : "") + formatDue(r.due)));

    const more = h("button", { class: "card-more", type: "button", "aria-label": "Task options", html: ICON.more });
    more.addEventListener("click", () => openMenu(more, [
      { heading: "Move to" },
      ...STATUSES.filter(s => s !== r.status).map(s => ({ label: s, icon: ICON.arrow, action: () => { r.status = s; touch(p); renderDb(p); toast("Moved to " + s); } })),
      { sep: true },
      { heading: "Priority" },
      ...PRIORITIES.filter(x => x !== r.priority).map(x => ({ label: x, iconText: "●", action: () => { r.priority = x; touch(p); renderDb(p); } })),
      { sep: true },
      { label: "Set due date", icon: ICON.edit, action: () => {
        const v = prompt("Due date (YYYY-MM-DD). Leave blank to clear.", r.due || todayStr());
        if (v === null) return;
        if (v && !/^\d{4}-\d{2}-\d{2}$/.test(v.trim())) return toast("Use the format YYYY-MM-DD");
        r.due = v.trim(); touch(p); renderDb(p);
      } },
      { label: "Delete", icon: ICON.trash, danger: true, action: () => deleteRow(p, r) }
    ]));

    card.append(title, meta, more);
    return card;
  }

  // ================= Search =================
  function openSearch() {
    if (!ws) return;
    closePopover(); closeSlash();
    let sel = 0, items = [];
    const input = h("input", { class: "search-input", placeholder: "Search pages and tasks", "aria-label": "Search", type: "text" });
    const results = h("div", { class: "results", role: "listbox" });
    const back = h("div", { class: "modal-back", onmousedown: (e) => { if (e.target === back) close(); } },
      h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": "Search" }, input, results));
    function close() { back.remove(); }
    function run() {
      const q = input.value.trim().toLowerCase();
      items = [];
      ws.pages.forEach(p => {
        const t = p.title || "Untitled";
        if (!q || t.toLowerCase().includes(q)) items.push({ p, sub: p.type === "db" ? "Task board" : "Page" });
        else {
          const hit = p.type === "db" ? (p.rows.find(r => r.title.toLowerCase().includes(q)) || {}).title : (p.blocks.find(b => b.text.toLowerCase().includes(q)) || {}).text;
          if (hit) items.push({ p, sub: hit });
        }
      });
      sel = 0; draw(q);
    }
    function draw(q) {
      results.innerHTML = "";
      if (!items.length) { results.append(h("div", { class: "no-results" }, "No results for “" + q + "”. Try another word.")); return; }
      items.forEach((it, i) => results.append(h("button", { class: "result" + (i === sel ? " active" : ""), type: "button", role: "option",
        onclick: () => { close(); openPage(it.p.id); } },
        h("span", { class: "result-icon" }, it.p.icon || "📄"),
        h("span", { class: "result-main" }, h("span", { class: "result-title" }, it.p.title || "Untitled"), h("span", { class: "result-sub" }, it.sub)))));
    }
    input.addEventListener("input", run);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { e.preventDefault(); close(); }
      else if (e.key === "ArrowDown" && items.length) { e.preventDefault(); sel = (sel + 1) % items.length; draw(); }
      else if (e.key === "ArrowUp" && items.length) { e.preventDefault(); sel = (sel - 1 + items.length) % items.length; draw(); }
      else if (e.key === "Enter" && items[sel]) { e.preventDefault(); const id = items[sel].p.id; close(); openPage(id); }
    });
    document.body.append(back);
    input.focus();
    run();
  }

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k" && user) { e.preventDefault(); openSearch(); }
  });
  window.addEventListener("resize", () => { closePopover(); closeSlash(); });
  window.addEventListener("beforeunload", saveNow);
  setInterval(updateEdited, 30000);

  // ================= Boot =================
  const session = store.get(KEYS.session, null);
  if (session) startApp(session);
})();
</script>
</body>
</html>
